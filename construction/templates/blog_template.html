{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ post.title }} – SakhiConstruction Blog</title>
  <meta name="description" content="{{ post.description|default:'Read our latest construction insights and tips on building strong foundations.' }}">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'styles/nav.css' %}">
  <link rel="stylesheet" href="{% static 'styles/main.css' %}">
  <link rel="icon" href="{% static 'assets/ConstructionLogo.png' %}" type="image/x-icon">
  <style>
    body { background-color: #0B0B0B; color: #fff; }
    a { color: #ffc107; }
    a:hover { color: #e6b800; text-decoration: none; }
    .blog-header { text-align: center; padding: 4rem 0 2rem 0; }
    .blog-header h1 { color: #ffc107; font-weight: 700; }
    .blog-meta { color: #ccc; font-size: 0.9rem; margin-bottom: 2rem; }
    .blog-img { width: 100%; max-height: 400px; object-fit: cover; border-radius: 8px; margin-bottom: 2rem; }
    .blog-content p { line-height: 1.8; margin-bottom: 1.5rem; }
    .blog-content h2, .blog-content h3 { color: #ffc107; margin-top: 2rem; margin-bottom: 1rem; }
    .blog-content blockquote { border-left: 4px solid #ffc107; padding-left: 1rem; color: #ccc; font-style: italic; margin: 1.5rem 0; }
    .btn-back { margin-top: 2rem; background-color: #ffc107; color: #0B0B0B; border: none; padding: 8px 16px; border-radius: 5px; text-decoration: none; }
    .btn-back:hover { background-color: #e6b800; color: #0B0B0B; }
  </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark navbar-custom fixed-top">
  <div class="container">
    <a class="navbar-brand" href="{% url 'home' %}">SakhiConstruction</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"><div></div></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto me-3">
        <li class="nav-item"><a style="font-weight: bolder;" class="nav-link" href="{% url 'home' %}">Home</a></li>
        <li class="nav-item"><a style="font-weight: bolder;" class="nav-link" href="{% url 'blog_list' %}">Blog</a></li>
      </ul>
    </div>
  </div>
</nav>

<main class="container" style="padding-top: 100px; padding-bottom: 4rem;">

  <header class="blog-header">
    <h1>{{ post.title }}</h1>
    <p class="blog-meta">By <b>{{ post.author.first_name }} {{ post.author.last_name }} </b> · {{ post.created_at|date:"F j, Y" }}</p>
    <img src="{{ post.image.url }}" alt="{{ post.title }}" class="blog-img">
  </header>

  <article class="blog-content text-light">
    <p>{{ post.description }}</p>
    {{ post.content|safe }}

    <a href="{% url 'blog_list' %}" class="btn btn-back">← Back to Blog</a>
  </article>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
